name: iOS CI

# Private repos get limited free macOS minutes — macOS runners are billed at
# 10x, so this runs on pushes/PRs but can also be dispatched manually.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # UITourTests and ScreenshotTests are manual-QA screenshot suites —
      # they interact with system dialogs (dictation, keyboard onboarding)
      # that don't exist on a fresh CI sim, so they run locally, not here.
      - name: Build and test
        run: >-
          xcodebuild
          -project FifiRecipes.xcodeproj
          -scheme FifiRecipes
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -configuration Debug
          clean test
          -only-testing:FifiRecipesTests
          -only-testing:FifiRecipesUITests/FifiRecipesUITests
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      # The log only names a failing test; the result bundle has the failing
      # assertion, its file and line, and screenshots of the simulator.
      - name: Show test failures
        if: failure()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact | python3 -c 'import json,sys; [print(f["testIdentifierString"], "-", f["failureText"]) for f in json.load(sys.stdin).get("testFailures", [])]' || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
